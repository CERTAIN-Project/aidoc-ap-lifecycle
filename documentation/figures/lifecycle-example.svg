<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 670" width="1130" height="670" role="img" aria-label="Lifecycle of the model energy-load-xgb-v1: nine lifecycle activities of the AIDOC-AP core are each linked to the model by a Lifecycle Extension property and carry their own values, such as hyperparameter settings, packaging format, registry stage, build status, serving endpoint, drift and decommissioning reason." font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>AIDOC-AP Lifecycle Extension: the lifecycle of one model</title>
  <defs>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a7373"/>
    </marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1129" height="669" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- value chips, top row -->
  <g font-size="11">
    <rect x="30" y="20" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="125" y="35" text-anchor="middle" fill="#0a7373">hasHyperParameterSetting</text>
    <text x="125" y="50" text-anchor="middle" fill="#1d2733">learning_rate = 0.283</text>
    <rect x="250" y="20" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="345" y="35" text-anchor="middle" fill="#0a7373">producesMeasurement</text>
    <text x="345" y="50" text-anchor="middle" fill="#1d2733">MSE 12966 on test data</text>
    <rect x="470" y="20" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="565" y="35" text-anchor="middle" fill="#0a7373">packagingFormat</text>
    <text x="565" y="50" text-anchor="middle" fill="#1d2733">MLflow Model</text>
    <rect x="690" y="20" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="785" y="35" text-anchor="middle" fill="#0a7373">assignsRegistryStage</text>
    <text x="785" y="50" text-anchor="middle" fill="#1d2733">Production</text>
    <rect x="910" y="20" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="1005" y="35" text-anchor="middle" fill="#0a7373">buildStatus · testLevel</text>
    <text x="1005" y="50" text-anchor="middle" fill="#1d2733">Succeeded · Integration</text>
  </g>

  <!-- activities, top row -->
  <g>
    <rect x="30" y="70" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
    <rect x="250" y="70" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
    <rect x="470" y="70" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
    <rect x="690" y="70" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
    <rect x="910" y="70" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1d2733" text-anchor="middle">
    <text x="125" y="95">M1 Model engineering</text>
    <text x="345" y="95">M2 Model evaluation</text>
    <text x="565" y="95">M3 Model packaging</text>
    <text x="785" y="95">M4 Model versioning</text>
    <text x="1005" y="95">S2 Build and integration test</text>
  </g>
  <g font-size="11" fill="#4a5868" text-anchor="middle">
    <text x="125" y="115">aidoc:ModelEngineering</text>
    <text x="345" y="115">aidoc:ModelEvaluation</text>
    <text x="565" y="115">aidoc:ModelPackaging</text>
    <text x="785" y="115">aidoc:ModelVersioning</text>
    <text x="1005" y="115">aidoc:BuildAndIntegrationTesting</text>
  </g>

  <!-- the model -->
  <rect x="455" y="300" width="220" height="64" rx="8" fill="#f2f3f5" stroke="#3b4652" stroke-width="1.5"/>
  <text x="565" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2733">energy-load-xgb-v1</text>
  <text x="565" y="347" text-anchor="middle" font-size="11" fill="#4a5868">aidoc:AIModel</text>

  <!-- training data and the next version (core and PROV-O links) -->
  <rect x="30" y="300" width="180" height="64" rx="8" fill="#f2f3f5" stroke="#3b4652"/>
  <text x="120" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2733">Training data</text>
  <text x="120" y="347" text-anchor="middle" font-size="11" fill="#4a5868">aidoc:Dataset</text>
  <rect x="920" y="300" width="180" height="64" rx="8" fill="#f2f3f5" stroke="#3b4652"/>
  <text x="1010" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2733">energy-load-xgb-v2</text>
  <text x="1010" y="347" text-anchor="middle" font-size="11" fill="#4a5868">aidoc:AIModel</text>

  <g stroke="#6b7785" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#grey)">
    <line x1="95" y1="130" x2="95" y2="298"/>
    <line x1="920" y1="332" x2="677" y2="332"/>
  </g>
  <g font-size="11" fill="#4a5868" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="101" y="230">prov:used</text>
    <text x="798" y="324" text-anchor="middle">prov:wasRevisionOf</text>
  </g>

  <!-- extension links, top row to the model -->
  <g stroke="#0a7373" stroke-width="1.6" fill="none" marker-end="url(#acc)">
    <line x1="160" y1="130" x2="478" y2="298"/>
    <line x1="345" y1="130" x2="521" y2="298"/>
    <line x1="565" y1="130" x2="565" y2="298"/>
    <line x1="785" y1="130" x2="609" y2="298"/>
    <line x1="1005" y1="130" x2="652" y2="298"/>
  </g>
  <g font-size="12" font-weight="600" fill="#0a7373" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="319" y="219">producesModel</text>
    <text x="433" y="219">evaluates</text>
    <text x="565" y="219">packagesModel</text>
    <text x="697" y="219">versionsModel</text>
    <text x="829" y="219">testsArtifact</text>
  </g>

  <!-- activities, bottom row -->
  <g>
    <rect x="140" y="500" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
    <rect x="360" y="500" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
    <rect x="580" y="500" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
    <rect x="800" y="500" width="190" height="60" rx="8" fill="#eaf2fb" stroke="#2f6fb0"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1d2733" text-anchor="middle">
    <text x="235" y="524">S3 Deployment</text>
    <text x="455" y="524">O2 Post-market monitoring</text>
    <text x="675" y="522">O3 Re-evaluation</text>
    <text x="895" y="524">O4 Decommissioning</text>
  </g>
  <g font-size="11" fill="#4a5868" text-anchor="middle">
    <text x="235" y="544">aidoc:Deployment</text>
    <text x="455" y="544" font-size="10">aidoc:PostMarketMonitoringActivity</text>
    <text x="675" y="538" font-size="10">aidoc:PostMarketPerformance</text>
    <text x="675" y="551" font-size="10">EvaluationActivity</text>
    <text x="895" y="544">aidoc:Decommissioning</text>
  </g>

  <!-- extension links, bottom row to the model -->
  <g stroke="#0a7373" stroke-width="1.6" fill="none" marker-end="url(#acc)">
    <line x1="235" y1="500" x2="497" y2="366"/>
    <line x1="455" y1="500" x2="543" y2="366"/>
    <line x1="675" y1="500" x2="588" y2="366"/>
    <line x1="895" y1="500" x2="633" y2="366"/>
  </g>
  <g font-size="12" font-weight="600" fill="#0a7373" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="366" y="437">deploys</text>
    <text x="499" y="437">monitors</text>
    <text x="632" y="437">evaluates</text>
    <text x="764" y="437">decommissions</text>
  </g>

  <!-- value chips, bottom row -->
  <g font-size="11">
    <rect x="140" y="572" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="235" y="587" text-anchor="middle" fill="#0a7373">servingEndpoint</text>
    <text x="235" y="602" text-anchor="middle" fill="#1d2733">…:8080/predict</text>
    <rect x="360" y="572" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="455" y="587" text-anchor="middle" fill="#0a7373">producesMeasurement</text>
    <text x="455" y="602" text-anchor="middle" fill="#1d2733">drift (PSI) 0.23</text>
    <rect x="580" y="572" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="675" y="587" text-anchor="middle" fill="#0a7373">producesMeasurement</text>
    <text x="675" y="602" text-anchor="middle" fill="#1d2733">RMSE 142.0 on 2024 data</text>
    <rect x="800" y="572" width="190" height="38" rx="6" fill="#eef8f7" stroke="#0a7373"/>
    <text x="895" y="587" text-anchor="middle" fill="#0a7373">decommissioningReason</text>
    <text x="895" y="602" text-anchor="middle" fill="#1d2733">replaced by v2</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#4a5868">
    <line x1="30" y1="645" x2="70" y2="645" stroke="#0a7373" stroke-width="1.6" marker-end="url(#acc)"/>
    <text x="78" y="649">Lifecycle Extension property (aidoc-lc:)</text>
    <line x1="330" y1="645" x2="370" y2="645" stroke="#6b7785" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#grey)"/>
    <text x="378" y="649">core or PROV-O property</text>
    <rect x="560" y="637" width="22" height="16" rx="4" fill="#eaf2fb" stroke="#2f6fb0"/>
    <text x="590" y="649">lifecycle activity (core class)</text>
    <rect x="780" y="637" width="22" height="16" rx="4" fill="#f2f3f5" stroke="#3b4652"/>
    <text x="810" y="649">artefact</text>
    <rect x="880" y="637" width="22" height="16" rx="4" fill="#eef8f7" stroke="#0a7373"/>
    <text x="910" y="649">stage-specific value</text>
  </g>
</svg>
