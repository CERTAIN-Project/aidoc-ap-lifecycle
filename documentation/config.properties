abstract=The AIDOC-AP Lifecycle Extension is a module of the AIDOC-AP application profile. It adds the terms needed to describe the stages of the AI system lifecycle that the AIDOC-AP core, which follows the technical documentation of Annex IV of the EU AI Act, does not cover in detail: links from lifecycle activities to the artefacts they use and produce (models, packages, code, measurements, change records) and stage-specific descriptions such as hyperparameter settings, packaging formats, registry stages, test levels, serving endpoints and decommissioning reasons. The module imports the core without changing it and reuses PROV-O, ML Schema, DQV and DPV. Its terms are grounded in the metadata of the CERTAIN Semantic MLOps Engine.
